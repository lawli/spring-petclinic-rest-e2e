  - key: petclinic|GET|/api/vets|state|empty-collection
    source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
    status: gap
    expectation: confirmed
    reason: >-
      Needs a collection with no entries, which cannot be arranged in a shared environment without deleting records
      this suite does not own. The expected answer is also open: the contract documents only 200 with an array,
      while the controller answers 404 with an empty body when the collection is empty.
    evidence:
      - {file: src/main/resources/openapi.yml, line: 1603, kind: requirement}
      - {file: src/main/resources/openapi.yml, line: 1613, kind: requirement}
      - {file: src/main/java/org/springframework/samples/petclinic/rest/controller/v1/VetRestControllerV1.java,
