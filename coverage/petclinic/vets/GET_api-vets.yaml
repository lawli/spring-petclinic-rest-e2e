  - key: petclinic|GET|/api/vets|state|conditional-get-not-modified
    source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
    status: gap
    expectation: confirmed
    reason: >-
      The contract documents 304 Not modified and an optional ETag response header, but the source configures no
      ETag generation or conditional-request handling, so no validator can be obtained to build the precondition,
      and the contract does not say which request must be answered with 304.
    evidence:
      - {file: src/main/resources/openapi.yml, line: 1616, kind: requirement}
  - key: petclinic|GET|/api/vets|auth|unauthenticated-request-rejected
    source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
    status: blocked
    expectation: confirmed
    reason: >-
      Blocked on user input. Authentication and role checks are active only when the service runs with petclinic.security.enable=true
      (BasicAuthenticationConfig.java:20); the pinned reference sets it to false (application.properties:49) and
      the local profile defines no role identities. Needed: (1) confirmation that the target runs with security
      enabled, (2) one test identity per role, referenced from the profile as ${VARIABLE}.
    evidence:
      - {file: readme.md, line: 230, kind: requirement}
      - {file: src/main/java/org/springframework/samples/petclinic/security/BasicAuthenticationConfig.java, line: 20,
        kind: declarative}
