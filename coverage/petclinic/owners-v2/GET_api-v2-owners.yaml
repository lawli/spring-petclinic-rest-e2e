  - key: petclinic|GET|/api/v2/owners|auth|unauthenticated-request-rejected
    source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
    status: blocked
    expectation: confirmed
    reason: >-
      Blocked on user input. Authentication and role checks are active only when the service runs with petclinic.security.enable=true
      (BasicAuthenticationConfig.java:20); the pinned reference sets it to false (application.properties:49) and
      the local profile defines no role identities. Needed: (1) confirmation that the target runs with security
      enabled, (2) one test identity per role, referenced from the profile as ${VARIABLE}.
    evidence:
