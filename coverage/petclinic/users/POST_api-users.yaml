    status: blocked
    expectation: confirmed
    reason: >-
      Blocked on user input. The API has no operation that deletes a user, so a case that creates one cannot declare
      the executable cleanup that write cases require, and the default datastore is an in-memory H2 that cannot
      be reached from outside the service. Needed: a way to remove test users (database access for teardown) or
      a decision on how they may be cleaned up.
