schema: v1
name: Delete a pet returns the deleted pet
description: >-
  Creates an owner with a pet and deletes the pet. The contract documents 200 with the Pet in the
  body (openapi.yml:1057-1067). The controller answers 204 without a body
  (PetRestControllerV1.java:95). Known defect, reproduced:
  defects/delete-answers-204-instead-of-200.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|DELETE|/api/pets/{petId}|happy|delete-pet", variant: default}
known_defects:
  - ref: defects/delete-answers-204-instead-of-200.md
    step: "delete the pet"
    at: status
data:
  isolated: true
  cleanup: >-
    The case itself deletes the pet; teardown repeats that delete expecting 404, then deletes the
    owner and the pet type created by this run. If teardown reports a failure, use the run id
    (case.id_short in the report's residual data), in this order: DELETE /api/pets/{id} for the pet
    named "pet-<run id>", DELETE /api/owners/{id} for the owner whose address starts with
    "apitest-<run id>", DELETE /api/pettypes/{id} for the type named "apitest-type-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: delete the pet
    request:
      method: DELETE
      path: "/api/pets/${ctx.pet_id}"
    assert:
      status: 200
      json:
        id: "${ctx.pet_id}"
        name: "pet-${ctx.case.id_short}"
        type.id: "${ctx.type_id}"
teardown:
  steps:
    - name: "teardown: delete the pet if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
      assert:
        status: 404
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
