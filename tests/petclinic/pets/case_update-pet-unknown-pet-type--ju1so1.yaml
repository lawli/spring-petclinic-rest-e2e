schema: v1
name: Update a pet to a type that does not exist
description: >-
  Pending expectation. The contract documents 404 as "Pet not found" (openapi.yml:1028-1029) and
  says nothing about a pet type that does not exist. The service looks the type up by id
  (ClinicServiceImpl.java:215); with type 0 the lookup finds nothing, the update violates a
  constraint and the handler for data-integrity errors answers 404 with a ProblemDetail
  (ExceptionControllerAdvice.java:97-108). This case records that implemented answer and that the
  pet keeps its type; it needs a contract statement of the status for an unknown pet type.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/pets/{petId}|error|unknown-pet-type", variant: default}
expectation: pending
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet, then its owner, then the pet type, all created by this run. If it
    fails, use the run id (case.id_short in the report's residual data), in this order:
    DELETE /api/pets/{id} for the pet named "pet-<run id>", DELETE /api/owners/{id} for the owner
    whose address starts with "apitest-<run id>", DELETE /api/pettypes/{id} for the type named
    "apitest-type-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: update the pet to pet type 0
    request:
      method: PUT
      path: "/api/pets/${ctx.pet_id}"
      body:
        name: "pet-${ctx.case.id_short}"
        birthDate: "2020-01-15"
        type:
          id: 0
          name: none
    assert:
      status: 404
      json:
        status: 404
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
  - name: the pet keeps its type
    request:
      method: GET
      path: "/api/pets/${ctx.pet_id}"
    assert:
      status: 200
      json:
        type.id: "${ctx.type_id}"
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
