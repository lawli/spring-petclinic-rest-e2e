schema: v1
name: Deleting a pet removes its visits
description: >-
  Creates an owner with a pet and a visit, deletes the pet and checks that the visit is gone.
  Visits are declared to follow their pet: the foreign key cascades on delete (schema.sql:59) and
  Pet.visits cascades all operations (Pet.java:45); the repository also deletes them explicitly
  (SpringDataPetRepositoryImpl.java:39). The delete step asserts nothing because its documented
  status is disputed separately.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|DELETE|/api/pets/{petId}|state|delete-pet-removes-visits", variant: default}
data:
  isolated: true
  cleanup: >-
    The case deletes the pet, which removes its visit; teardown repeats that delete expecting 404,
    then deletes the owner and the pet type created by this run. If teardown reports a failure, use
    the run id (case.id_short in the report's residual data), in this order: DELETE /api/pets/{id}
    for the pet named "pet-<run id>", DELETE /api/owners/{id} for the owner whose address starts
    with "apitest-<run id>", DELETE /api/pettypes/{id} for the type named "apitest-type-<run id>".
  resources: [visits, pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
    - name: "setup: add a visit to the pet"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets/${ctx.pet_id}/visits"
        body:
          date: "2024-03-10"
          description: "apitest-${ctx.case.id_short} checkup"
      extract:
        visit_id: "$.id"
steps:
  - name: delete the pet
    request:
      method: DELETE
      path: "/api/pets/${ctx.pet_id}"
  - name: the visit is gone
    request:
      method: GET
      path: "/api/visits/${ctx.visit_id}"
    assert:
      status: 404
teardown:
  steps:
    - name: "teardown: delete the pet if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
      assert:
        status: 404
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
