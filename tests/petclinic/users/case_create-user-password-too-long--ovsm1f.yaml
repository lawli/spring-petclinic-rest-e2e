schema: v1
name: Create a user with an 81-character password is rejected
description: >-
  password allows at most 80 characters (openapi.yml:2354). 81 characters is one past the boundary,
  so the answer is 400 with a ProblemDetail (openapi.yml:1880-1885). Read-only on two grounds,
  which matters because the API has no operation to delete a user: the body is rejected before the
  handler runs, and it carries no roles, which the service refuses before saving anything
  (UserServiceImpl.java:20-22). The password is built by repetition so that no literal long secret
  sits in the case file.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/users|validation|password-over-max-length", variant: default}
mutates: false
steps:
  - name: post a user whose password has 81 characters
    request:
      method: POST
      path: /api/users
      body:
        username: "u${ctx.case.id_short}"
        password: "${'p' * 81}"
        enabled: true
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors.0.message: "@type string"
