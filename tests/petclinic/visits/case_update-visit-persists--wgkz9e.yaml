schema: v1
name: A visit update is visible when the visit is read back
description: >-
  Creates an owner with a pet and a visit, updates the visit's date and description and reads the
  visit back: the stored record must show the new values (operation "Update a visit by ID",
  openapi.yml:1235). The update step asserts nothing so that this check does not depend on the
  disputed status of the update response (defects/update-answers-204-instead-of-200.md).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/visits/{visitId}|state|update-persists", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet (its visits go with it), then the owner, then the pet type, all created
    by this run. If it fails, use the run id (case.id_short in the report's residual data), in this
    order: DELETE /api/pets/{id} for the pet named "pet-<run id>", DELETE /api/owners/{id} for the
    owner whose address starts with "apitest-<run id>", DELETE /api/pettypes/{id} for the type named
    "apitest-type-<run id>".
  resources: [visits, pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
    - name: "setup: add a visit to the pet"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets/${ctx.pet_id}/visits"
        body:
          date: "2024-03-10"
          description: "apitest-${ctx.case.id_short} checkup"
      extract:
        visit_id: "$.id"
steps:
  - name: update the visit
    request:
      method: PUT
      path: "/api/visits/${ctx.visit_id}"
      body:
        date: "2024-04-20"
        description: "apitest-${ctx.case.id_short} follow-up"
  - name: read the visit back
    request:
      method: GET
      path: "/api/visits/${ctx.visit_id}"
    assert:
      status: 200
      json:
        id: "${ctx.visit_id}"
        date: "2024-04-20"
        description: "apitest-${ctx.case.id_short} follow-up"
        petId: "${ctx.pet_id}"
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
