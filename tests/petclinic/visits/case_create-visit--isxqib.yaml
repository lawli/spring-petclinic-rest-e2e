schema: v1
name: Create a visit returns the stored visit
description: >-
  Creates an owner with a pet and posts a Visit that names the pet. The contract documents 200 with
  the stored Visit (openapi.yml:1141-1151): generated id, date, description and pet id. The
  controller answers 201 (VisitRestControllerV1.java:83). Known defect, reproduced:
  defects/create-answers-201-instead-of-200.md. The read-only id is left out of the request body.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/visits|happy|create-visit", variant: default}
known_defects:
  - ref: defects/create-answers-201-instead-of-200.md
    step: "create a visit for the pet"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet (its visits go with it), then the owner, then the pet type, all created
    by this run. If it fails, use the run id (case.id_short in the report's residual data), in this
    order: DELETE /api/pets/{id} for the pet named "pet-<run id>", DELETE /api/owners/{id} for the
    owner whose address starts with "apitest-<run id>", DELETE /api/pettypes/{id} for the type named
    "apitest-type-<run id>".
  resources: [visits, pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: create a visit for the pet
    request:
      method: POST
      path: /api/visits
      body:
        date: "2024-03-10"
        description: "apitest-${ctx.case.id_short} checkup"
        petId: "${ctx.pet_id}"
    assert:
      status: 200
      json:
        id: "@number >= 0"
        date: "2024-03-10"
        description: "apitest-${ctx.case.id_short} checkup"
        petId: "${ctx.pet_id}"
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
