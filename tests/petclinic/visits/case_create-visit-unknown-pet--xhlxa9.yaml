schema: v1
name: Create a visit for a pet that does not exist
description: >-
  Pending expectation. The contract documents a 404 for this create but describes it as "Visit not
  found" (openapi.yml:1165-1166), which does not say what a pet id that matches no pet returns.
  With petId 0 (valid by schema, used by no pet) the insert fails on the pet foreign key and the
  handler for data-integrity errors answers 404 with a ProblemDetail
  (ExceptionControllerAdvice.java:97-108). This case records that implemented answer; it needs a
  contract statement of the status for an unknown pet (404 or 400). Read-only: the foreign key
  (schema.sql:59) means no visit can be stored for a pet that does not exist.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/visits|error|unknown-pet", variant: default}
expectation: pending
mutates: false
steps:
  - name: create a visit for pet 0
    request:
      method: POST
      path: /api/visits
      body:
        date: "2024-03-10"
        description: "apitest-${ctx.case.id_short} checkup"
        petId: 0
    assert:
      status: 404
      json:
        status: 404
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
