schema: v1
name: Create a visit without a date
description: >-
  Only description (and, for a Visit, id and petId) are required (openapi.yml:2281-2282,
  2305-2307), so a body without a date is valid and the visit must be stored. The create step
  checks the returned Visit but not the status, because the status of a successful create is
  disputed separately; the case then reads the new visit back by the id the create returned. The
  contract does not say which date the visit gets, so the date is not checked. The service
  answers 404 with a data-constraint ProblemDetail instead, because visit_date is NOT NULL
  (schema.sql:57). Known defect, reproduced: defects/visit-without-date-rejected.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/visits|boundary|date-omitted", variant: default}
known_defects:
  - ref: defects/visit-without-date-rejected.md
    step: create a visit with a description and pet id only
    at: json.description
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet (its visits go with it), then the owner, then the pet type, all created
    by this run. If it fails, use the run id (case.id_short in the report's residual data), in this
    order: DELETE /api/pets/{id} for the pet named "pet-<run id>", DELETE /api/owners/{id} for the
    owner whose address starts with "apitest-<run id>", DELETE /api/pettypes/{id} for the type named
    "apitest-type-<run id>".
  resources: [visits, pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: create a visit with a description and pet id only
    request:
      method: POST
      path: /api/visits
      body:
        description: "apitest-${ctx.case.id_short} checkup"
        petId: "${ctx.pet_id}"
    extract:
      visit_id: "$.id"
    assert:
      json:
        description: "apitest-${ctx.case.id_short} checkup"
        petId: "${ctx.pet_id}"
  - name: read the visit back
    request:
      method: GET
      path: "/api/visits/${ctx.visit_id}"
    assert:
      status: 200
      json:
        id: "${ctx.visit_id}"
        description: "apitest-${ctx.case.id_short} checkup"
        petId: "${ctx.pet_id}"
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
