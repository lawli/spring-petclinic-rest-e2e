schema: v1
name: Pet page of size 1 holds one pet and reports the remaining pages
description: >-
  Creates an owner with two pets, so at least two pets exist, and requests page 0 with size 1
  (parameters page and size, openapi.yml:880-900). The page holds exactly one pet and reports at
  least 2 total elements and at least 2 total pages (openapi.yml:2134-2147). The operation has no
  filter, so the totals include pets this run does not own and are checked as lower bounds.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/v2/pets|pagination|page-size-splits-result", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes both pets, then their owner, then the pet type, all created by this run. If it
    fails, use the run id (case.id_short in the report's residual data), in this order:
    DELETE /api/pets/{id} for the pets named "pet-<run id>" and "pet2-<run id>",
    DELETE /api/owners/{id} for the owner whose address starts with "apitest-<run id>",
    DELETE /api/pettypes/{id} for the type named "apitest-type-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a first pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
    - name: "setup: add a second pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet2-${ctx.case.id_short}"
          birthDate: "2021-02-20"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        second_pet_id: "$.id"
steps:
  - name: get pet page 0 with size 1
    request:
      method: GET
      path: /api/v2/pets
      params:
        page: 0
        size: 1
    assert:
      status: 200
      json:
        page: 0
        size: 1
        content: "@len 1"
        totalElements: "@number >= 2"
        totalPages: "@number >= 2"
teardown:
  steps:
    - name: "teardown: delete the first pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the second pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.second_pet_id}"
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
