schema: v1
name: Pet page without parameters uses page 0 and size 20
description: >-
  Creates an owner with one pet so the result cannot be empty and requests the pet page without
  parameters. page defaults to 0 and size to 20 (openapi.yml:888, 899), and the PetPage carries
  content, page, size, totalElements and totalPages (all required, openapi.yml:2148-2153). The pet
  type is created for this run, so no shared reference data is involved.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/v2/pets|pagination|default-page-and-size", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet, then its owner, then the pet type, all created by this run. If it
    fails, use the run id (case.id_short in the report's residual data), in this order:
    DELETE /api/pets/{id} for the pet named "pet-<run id>", DELETE /api/owners/{id} for the owner
    whose address starts with "apitest-<run id>", DELETE /api/pettypes/{id} for the type named
    "apitest-type-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: get the pet page without parameters
    request:
      method: GET
      path: /api/v2/pets
    assert:
      status: 200
      json:
        page: 0
        size: 20
        content: "@len >= 1"
        content.0.id: "@type integer"
        totalElements: "@number >= 1"
        totalPages: "@number >= 1"
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
