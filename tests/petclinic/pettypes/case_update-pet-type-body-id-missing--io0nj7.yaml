schema: v1
name: Update a pet type without the id in the body is rejected and changes nothing
description: >-
  The update body is a PetType, which requires id as well as name and does not mark id read-only
  (openapi.yml:2329-2337). A body with only a name must be answered with 400 and a ProblemDetail
  listing a schema validation error (openapi.yml:766-771), and the stored type must keep its name.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/pettypes/{petTypeId}|validation|body-id-missing", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet type created by this run. If it fails, find the type named
    "apitest-type-<case.id_short>" or "apitest-renamed-<case.id_short>" in GET /api/pettypes (the
    id is also in the report's residual data) and DELETE /api/pettypes/{id}.
  resources: [pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
steps:
  - name: update the pet type with a name but no id
    request:
      method: PUT
      path: "/api/pettypes/${ctx.type_id}"
      body:
        name: "apitest-renamed-${ctx.case.id_short}"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors.0.message: "@type string"
  - name: the pet type keeps its name
    request:
      method: GET
      path: "/api/pettypes/${ctx.type_id}"
    assert:
      status: 200
      json:
        name: "apitest-type-${ctx.case.id_short}"
teardown:
  steps:
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
