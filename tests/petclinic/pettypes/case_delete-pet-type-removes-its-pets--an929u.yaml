schema: v1
name: Deleting a pet type removes the pets of that type
description: >-
  Creates a pet type, an owner and a pet of that type, deletes the type and checks that the pet is
  gone. Pets are declared to follow their type: the foreign key cascades on delete (schema.sql:49),
  and the repository deletes the type's pets explicitly (SpringDataPetTypeRepositoryImpl.java:45).
  The delete step asserts nothing because its documented status is disputed separately. Only the
  type created for this run is deleted, so no other pet can be affected. Teardown works whether or
  not the delete went through: deleting the owner removes a pet that survived, and a helper deletes
  the type only if it is still there.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|DELETE|/api/pettypes/{petTypeId}|state|delete-type-removes-its-pets", variant: default}
data:
  isolated: true
  cleanup: >-
    The case deletes the pet type, which removes its pet. Teardown deletes the owner (a pet that
    survived goes with it), then lists the pet types and deletes the one named
    "apitest-type-<case.id_short>" if it is still there. If teardown reports a failure, use the run
    id (case.id_short in the report's residual data): DELETE /api/owners/{id} for the owner whose
    address starts with "apitest-<run id>", then DELETE /api/pettypes/{id} for the type named
    "apitest-type-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet of the new type to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: delete the pet type
    request:
      method: DELETE
      path: "/api/pettypes/${ctx.type_id}"
  - name: the pet of that type is gone
    request:
      method: GET
      path: "/api/pets/${ctx.pet_id}"
    assert:
      status: 404
  - name: the owner no longer lists the pet
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}"
    assert:
      status: 200
      json:
        pets: []
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
  python:
    - call: helpers.run_records.delete_marked
      args:
        service: petclinic
        collection: pettypes
        field: name
        prefix: "apitest-type-{run}"
