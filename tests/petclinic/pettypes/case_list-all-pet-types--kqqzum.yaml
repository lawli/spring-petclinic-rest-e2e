schema: v1
name: List pet types returns the collection including a new type
description: >-
  Creates a pet type and lists all pet types. The answer is 200 with an array of PetType objects
  (openapi.yml:594-606), each with id and name (openapi.yml:2322-2337), and the new type is one of
  them. Seed pet types are read, never changed.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/pettypes|happy|list-all-pet-types", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet type created by this run. If it fails, find the type named
    "apitest-type-<case.id_short>" in GET /api/pettypes (the id is also in the report's residual
    data) and DELETE /api/pettypes/{id}.
  resources: [pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
steps:
  - name: list all pet types
    request:
      method: GET
      path: /api/pettypes
    assert:
      status: 200
      json:
        "$": >-
          @contains {"id": ${ctx.type_id}, "name": "apitest-type-${ctx.case.id_short}"}
        0.id: "@type integer"
        0.name: "@type string"
teardown:
  steps:
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
