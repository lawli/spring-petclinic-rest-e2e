schema: v1
name: Create a pet type with an empty name is rejected
description: >-
  A pet type name needs at least one character (openapi.yml:2318). An empty string must be answered
  with 400 and a ProblemDetail listing a schema validation error (openapi.yml:652-657). Read-only
  by contract: the body is rejected before the handler runs. If a 2xx comes back, the response body
  holds the id to remove with DELETE /api/pettypes/{id}.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/pettypes|validation|name-empty", variant: default}
mutates: false
steps:
  - name: post a pet type with an empty name
    request:
      method: POST
      path: /api/pettypes
      body:
        name: ""
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors.0.message: "@type string"
