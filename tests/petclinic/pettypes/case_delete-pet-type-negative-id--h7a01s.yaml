schema: v1
name: Delete with a negative pet type id is a bad request and deletes no type
description: >-
  petTypeId has minimum 0 (openapi.yml:798) and the operation documents 400 (openapi.yml:819-824).
  The request uses the negated id of a pet type created for this run, so the case can also show
  that the invalid id does not delete that type. The exception handler maps only request-body
  validation to 400 (ExceptionControllerAdvice.java:117, 80). Known defect, reproduced:
  defects/invalid-request-values-not-answered-with-400.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|DELETE|/api/pettypes/{petTypeId}|validation|negative-id", variant: default}
known_defects:
  - ref: defects/invalid-request-values-not-answered-with-400.md
    step: "delete using the negated pet type id"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet type created by this run. If it fails, find the type named
    "apitest-type-<case.id_short>" in GET /api/pettypes (the id is also in the report's residual
    data) and DELETE /api/pettypes/{id}.
  resources: [pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
steps:
  - name: delete using the negated pet type id
    request:
      method: DELETE
      path: "/api/pettypes/-${ctx.type_id}"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
  - name: the pet type with the positive id still exists
    request:
      method: GET
      path: "/api/pettypes/${ctx.type_id}"
    assert:
      status: 200
      json:
        id: "${ctx.type_id}"
teardown:
  steps:
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
