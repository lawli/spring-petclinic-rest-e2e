schema: v1
name: Create a pet type with an 81-character name is rejected
description: >-
  A pet type name allows at most 80 characters (openapi.yml:2317). 81 characters is one past the
  boundary, so the answer is 400 with a ProblemDetail (openapi.yml:652-657). Read-only by contract:
  the body is rejected before the handler runs. If a 2xx comes back, the response body holds the id
  to remove with DELETE /api/pettypes/{id}; the name starts with "apitest-type-<case.id_short>".
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/pettypes|validation|name-over-max-length", variant: default}
mutates: false
steps:
  - name: post a pet type whose name has 81 characters
    request:
      method: POST
      path: /api/pettypes
      body:
        name: "apitest-type-${ctx.case.id_short}${'x' * 56}"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors.0.message: "@type string"
