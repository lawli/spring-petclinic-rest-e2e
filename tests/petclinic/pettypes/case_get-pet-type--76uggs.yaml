schema: v1
name: Get a pet type by id returns the type
description: >-
  Creates a pet type and reads it by id. The answer is 200 with the PetType (openapi.yml:688-698):
  its id and name (openapi.yml:2322-2337).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/pettypes/{petTypeId}|happy|get-existing-pet-type", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet type created by this run. If it fails, find the type named
    "apitest-type-<case.id_short>" in GET /api/pettypes (the id is also in the report's residual
    data) and DELETE /api/pettypes/{id}.
  resources: [pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
steps:
  - name: get the pet type by id
    request:
      method: GET
      path: "/api/pettypes/${ctx.type_id}"
    assert:
      status: 200
      json:
        id: "${ctx.type_id}"
        name: "apitest-type-${ctx.case.id_short}"
teardown:
  steps:
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
