schema: v1
name: Get a pet type after it was deleted returns 404
description: >-
  Creates a pet type, deletes it in setup and reads it by id: a deleted type is no longer found
  (404, openapi.yml:712). Only the status is checked here; the 404 body is covered by the id-zero
  case. The setup delete carries no status assertion because its documented status is disputed
  (defects/delete-answers-204-instead-of-200.md).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/pettypes/{petTypeId}|state|get-after-delete", variant: default}
data:
  isolated: true
  cleanup: >-
    The pet type created by this run is deleted in setup; teardown repeats the delete and expects
    404. If teardown reports a failure, find the type named "apitest-type-<case.id_short>" in
    GET /api/pettypes and DELETE /api/pettypes/{id}.
  resources: [pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
steps:
  - name: get the deleted pet type
    request:
      method: GET
      path: "/api/pettypes/${ctx.type_id}"
    assert:
      status: 404
teardown:
  steps:
    - name: "teardown: delete the pet type if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
      assert:
        status: 404
