schema: v1
name: Owner pages split a filtered result of three owners into two pages of size 2
description: >-
  Creates three owners that share a last name unique to this run and pages through them with size 2
  (parameters page and size, openapi.yml:154-174). The first page holds two owners, the second one
  owner, and both report 3 total elements in 2 total pages (openapi.yml:2089-2102). The filter keeps
  other owners in the environment out of the arithmetic. Owner names must match the contract's
  letters-only pattern, so the hex run id is mapped to letters (0-9 become g-p).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/v2/owners|pagination|pages-partition-filtered-result", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the three owners created by this run. If it fails, find the owners whose
    address starts with "apitest-<case.id_short>" in GET /api/owners (the ids are also in the
    report's residual data) and DELETE /api/owners/{id} for each.
  resources: [owners]
setup:
  steps:
    - name: "setup: create the first owner with the run-unique last name"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: &last "Zz${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}"
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        first_owner_id: "$.id"
    - name: "setup: create the second owner with the same last name"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: *last
          address: "apitest-${ctx.case.id_short} 2 Test Street"
          city: Testville
          telephone: "6085550101"
      extract:
        second_owner_id: "$.id"
    - name: "setup: create the third owner with the same last name"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: *last
          address: "apitest-${ctx.case.id_short} 3 Test Street"
          city: Testville
          telephone: "6085550102"
      extract:
        third_owner_id: "$.id"
steps:
  - name: get page 0 with size 2
    request:
      method: GET
      path: /api/v2/owners
      params:
        lastName: *last
        page: 0
        size: 2
    assert:
      status: 200
      json:
        page: 0
        size: 2
        content: "@len 2"
        content.0.lastName: *last
        content.1.lastName: *last
        totalElements: 3
        totalPages: 2
  - name: get page 1 with size 2
    request:
      method: GET
      path: /api/v2/owners
      params:
        lastName: *last
        page: 1
        size: 2
    assert:
      status: 200
      json:
        page: 1
        size: 2
        content: "@len 1"
        content.0.lastName: *last
        totalElements: 3
        totalPages: 2
teardown:
  steps:
    - name: "teardown: delete the first owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.first_owner_id}"
    - name: "teardown: delete the second owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.second_owner_id}"
    - name: "teardown: delete the third owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.third_owner_id}"
