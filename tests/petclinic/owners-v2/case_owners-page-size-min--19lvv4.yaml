schema: v1
name: Owner page with the smallest size returns one owner
description: >-
  size has minimum 1 (openapi.yml:171). Creates one owner so the result cannot be empty and
  requests size 1: the answer is 200 with exactly one owner in the content and size 1 echoed.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/v2/owners|boundary|size-min-1", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: get the owner page with size 1
    request:
      method: GET
      path: /api/v2/owners
      params:
        size: 1
    assert:
      status: 200
      json:
        page: 0
        size: 1
        content: "@len 1"
        totalElements: "@number >= 1"
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
