schema: v1
name: Owner page with size 101 is a bad request
description: >-
  Read-only. size has maximum 100 (openapi.yml:172) and the operation documents 400 with a
  ProblemDetail (openapi.yml:194-199), so size 101 must be answered with 400. The exception handler
  maps only request-body validation to 400 (ExceptionControllerAdvice.java:117, 80). Known
  defect, reproduced: defects/invalid-request-values-not-answered-with-400.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/v2/owners|validation|size-over-max", variant: default}
known_defects:
  - ref: defects/invalid-request-values-not-answered-with-400.md
    step: "get the owner page with size 101"
    at: status
steps:
  - name: get the owner page with size 101
    request:
      method: GET
      path: /api/v2/owners
      params:
        size: 101
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
