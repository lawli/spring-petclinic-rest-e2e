schema: v1
name: Owner page filtered by last name returns only the matching owner
description: >-
  Creates an owner with a last name unique to this run and requests the owner page with the
  lastName parameter (openapi.yml:147). The page holds exactly that owner and reports one element
  in one page. Owner names must match the contract's letters-only pattern, so the hex run id is
  mapped to letters (0-9 become g-p).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/v2/owners|happy|filter-by-last-name", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner with a run-unique last name"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: &last "Zz${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}"
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: get the owner page for the unique last name
    request:
      method: GET
      path: /api/v2/owners
      params:
        lastName: *last
    assert:
      status: 200
      json:
        page: 0
        size: 20
        content: "@len 1"
        content.0.id: "${ctx.owner_id}"
        content.0.lastName: *last
        content.0.address: "apitest-${ctx.case.id_short} 1 Test Street"
        totalElements: 1
        totalPages: 1
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
