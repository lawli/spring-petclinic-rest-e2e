schema: v1
name: Owner page beyond the last page is empty
description: >-
  Pending expectation. The contract defines page as a zero-based index with minimum 0
  (openapi.yml:154-163) and does not say what a page past the end returns. The controller passes
  the index straight to the repository (OwnerRestControllerV2.java:36-38), which yields an empty
  page. This case records that implemented answer for page 5 of a one-owner result; it needs a
  contract statement (empty page, or an error).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/v2/owners|boundary|page-beyond-last", variant: default}
expectation: pending
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner with a run-unique last name"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: &last "Zz${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}"
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: get page 5 of the one-owner result
    request:
      method: GET
      path: /api/v2/owners
      params:
        lastName: *last
        page: 5
        size: 2
    assert:
      status: 200
      json:
        page: 5
        size: 2
        content: []
        totalElements: 1
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
