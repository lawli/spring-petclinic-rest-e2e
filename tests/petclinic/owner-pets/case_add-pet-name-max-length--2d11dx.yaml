schema: v1
name: Add a pet with a 30-character name
description: >-
  A pet name allows at most 30 characters (openapi.yml:2163). A name of exactly 30 characters (the
  run marker padded with "x") is on the boundary and must be accepted with 201 and stored
  unchanged.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners/{ownerId}/pets|boundary|name-max-length-30", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet, then its owner, then the pet type, all created by this run. If it
    fails, use the run id (case.id_short in the report's residual data), in this order:
    DELETE /api/pets/{id} for the pet whose name starts with "pet-<run id>", DELETE /api/owners/{id}
    for the owner whose address starts with "apitest-<run id>", DELETE /api/pettypes/{id} for the
    type named "apitest-type-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: add a pet whose name has 30 characters
    request:
      method: POST
      path: "/api/owners/${ctx.owner_id}/pets"
      body:
        name: "pet-${ctx.case.id_short}${'x' * 14}"
        birthDate: "2020-01-15"
        type:
          id: "${ctx.type_id}"
          name: "apitest-type-${ctx.case.id_short}"
    extract:
      pet_id: "$.id"
    assert:
      status: 201
      json:
        name: "pet-${ctx.case.id_short}${'x' * 14}"
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
