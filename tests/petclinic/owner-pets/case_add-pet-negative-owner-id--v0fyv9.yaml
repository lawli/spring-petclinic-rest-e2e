schema: v1
name: Add a pet with a negative owner id is a bad request and adds no pet
description: >-
  ownerId has minimum 0 (openapi.yml:377) and the operation documents 400 (openapi.yml:393-398).
  The request uses the negated id of an owner created for this run, so the case can also show that
  no pet lands on that owner. The exception handler maps only request-body validation to 400
  (ExceptionControllerAdvice.java:117, 80). Known defect, reproduced:
  defects/invalid-request-values-not-answered-with-400.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners/{ownerId}/pets|validation|negative-owner-id", variant: default}
known_defects:
  - ref: defects/invalid-request-values-not-answered-with-400.md
    step: "add a pet using the negated owner id"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet type first, which also removes any pet of that type the request may
    have stored against the contract, then the owner. If it fails, use the run id (case.id_short
    in the report's residual data): DELETE /api/pettypes/{id} for the type named
    "apitest-type-<run id>", then DELETE /api/owners/{id} for the owner whose address starts with
    "apitest-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: add a pet using the negated owner id
    request:
      method: POST
      path: "/api/owners/-${ctx.owner_id}/pets"
      body:
        name: "pet-${ctx.case.id_short}"
        birthDate: "2020-01-15"
        type:
          id: "${ctx.type_id}"
          name: "apitest-type-${ctx.case.id_short}"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
  - name: the owner with the positive id still has no pets
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}"
    assert:
      status: 200
      json:
        pets: []
teardown:
  steps:
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
