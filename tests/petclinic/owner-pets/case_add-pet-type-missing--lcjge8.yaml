schema: v1
name: Add a pet without a type is rejected
description: >-
  type is required in PetFields (openapi.yml:2174, 2177). A body without it must be answered with
  400 and a ProblemDetail listing a schema validation error (openapi.yml:393-398), and the owner
  must still have no pets. No pet type is needed, so only an owner is created.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners/{ownerId}/pets|validation|type-missing", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run; a pet stored against the contract would be
    removed with it. If it fails, find the owner whose address starts with
    "apitest-<case.id_short>" in GET /api/owners and DELETE /api/owners/{id}.
  resources: [pets, owners]
setup:
  steps:
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: add a pet without a type
    request:
      method: POST
      path: "/api/owners/${ctx.owner_id}/pets"
      body:
        name: "pet-${ctx.case.id_short}"
        birthDate: "2020-01-15"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors.0.message: "@type string"
  - name: the owner still has no pets
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}"
    assert:
      status: 200
      json:
        pets: []
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
