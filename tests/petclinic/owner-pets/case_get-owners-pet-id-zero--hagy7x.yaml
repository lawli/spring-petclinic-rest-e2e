schema: v1
name: Get pet 0 of an existing owner is valid but not found
description: >-
  Creates an owner and asks for pet 0 under it. petId has minimum 0 (openapi.yml:435), so 0 passes
  parameter validation, and no pet can have it because ids are generated identities starting at 1.
  The answer is 404 with a ProblemDetail (openapi.yml:462-467). The controller returns 404 without
  a body (OwnerRestControllerV1.java:201). Known defect, reproduced:
  defects/not-found-without-problem-detail.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/owners/{ownerId}/pets/{petId}|boundary|pet-id-zero-not-found", variant: default}
known_defects:
  - ref: defects/not-found-without-problem-detail.md
    step: "get pet 0 of the owner"
    at: json.status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: get pet 0 of the owner
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}/pets/0"
    assert:
      status: 404
      json:
        status: 404
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
