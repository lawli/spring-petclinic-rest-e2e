schema: v1
name: Get a pet through an owner it does not belong to returns 404
description: >-
  Creates two owners and a pet for the first one, then asks for that pet under the second owner.
  The pet exists but not for this owner, so the answer is 404 "Owner or pet not found" with a
  ProblemDetail (openapi.yml:462-467). The controller returns 404 without a body
  (OwnerRestControllerV1.java:201). Known defect, reproduced:
  defects/not-found-without-problem-detail.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/owners/{ownerId}/pets/{petId}|error|pet-of-another-owner", variant: default}
known_defects:
  - ref: defects/not-found-without-problem-detail.md
    step: "get the pet under the second owner"
    at: json.status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet, both owners and the pet type, all created by this run. If it fails,
    use the run id (case.id_short in the report's residual data), in this order:
    DELETE /api/pets/{id} for the pet named "pet-<run id>", DELETE /api/owners/{id} for both
    owners whose address starts with "apitest-<run id>", DELETE /api/pettypes/{id} for the type
    named "apitest-type-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create the owner of the pet"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: create a second owner without pets"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Other
          address: "apitest-${ctx.case.id_short} 2 Other Street"
          city: Testville
          telephone: "6085550101"
      extract:
        other_owner_id: "$.id"
    - name: "setup: add a pet to the first owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: get the pet under the second owner
    request:
      method: GET
      path: "/api/owners/${ctx.other_owner_id}/pets/${ctx.pet_id}"
    assert:
      status: 404
      json:
        status: 404
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the first owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the second owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.other_owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
