schema: v1
name: Update a pet through an owner it does not belong to returns 404 and changes nothing
description: >-
  Creates two owners and a pet for the first one, then updates that pet under the second owner. The
  contract answers 404 "Pet not found for this owner" with a ProblemDetail (openapi.yml:516-521),
  and the pet must keep its name. The controller checks that the owner exists and then loads the pet
  by id alone (OwnerRestControllerV1.java:161-169), so it would apply the update. Known defect,
  reproduced: defects/pet-updated-through-another-owner.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/owners/{ownerId}/pets/{petId}|error|pet-of-another-owner", variant: default}
known_defects:
  - ref: defects/pet-updated-through-another-owner.md
    step: "update the pet under the second owner"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet, both owners and the pet type, all created by this run. If it fails,
    use the run id (case.id_short in the report's residual data), in this order:
    DELETE /api/pets/{id} for the pet named "pet-<run id>" or "moved-<run id>",
    DELETE /api/owners/{id} for both owners whose address starts with "apitest-<run id>",
    DELETE /api/pettypes/{id} for the type named "apitest-type-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create the owner of the pet"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: create a second owner without pets"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Other
          address: "apitest-${ctx.case.id_short} 2 Other Street"
          city: Testville
          telephone: "6085550101"
      extract:
        other_owner_id: "$.id"
    - name: "setup: add a pet to the first owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: update the pet under the second owner
    request:
      method: PUT
      path: "/api/owners/${ctx.other_owner_id}/pets/${ctx.pet_id}"
      body:
        name: "moved-${ctx.case.id_short}"
        birthDate: "2021-06-30"
        type:
          id: "${ctx.type_id}"
          name: "apitest-type-${ctx.case.id_short}"
    assert:
      status: 404
      json:
        status: 404
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
  - name: the pet is unchanged under its real owner
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}/pets/${ctx.pet_id}"
    assert:
      status: 200
      json:
        name: "pet-${ctx.case.id_short}"
        birthDate: "2020-01-15"
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the first owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the second owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.other_owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
