schema: v1
name: Update a pet through its owner and read the change back
description: >-
  Creates an owner with a pet, replaces the pet's name and birth date through the owner path and
  expects 204 without a body (openapi.yml:508-509). Reading the pet back must show the new values
  ("Updates the pet record with the specified details", openapi.yml:480).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/owners/{ownerId}/pets/{petId}|happy|update-owners-pet", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet, then its owner, then the pet type, all created by this run. If it
    fails, use the run id (case.id_short in the report's residual data), in this order:
    DELETE /api/pets/{id} for the pet named "pet-<run id>" or "renamed-<run id>",
    DELETE /api/owners/{id} for the owner whose address starts with "apitest-<run id>",
    DELETE /api/pettypes/{id} for the type named "apitest-type-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: update the pet through its owner
    request:
      method: PUT
      path: "/api/owners/${ctx.owner_id}/pets/${ctx.pet_id}"
      body:
        name: "renamed-${ctx.case.id_short}"
        birthDate: "2021-06-30"
        type:
          id: "${ctx.type_id}"
          name: "apitest-type-${ctx.case.id_short}"
    assert:
      status: 204
  - name: read the pet back
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}/pets/${ctx.pet_id}"
    assert:
      status: 200
      json:
        id: "${ctx.pet_id}"
        name: "renamed-${ctx.case.id_short}"
        birthDate: "2021-06-30"
        type.id: "${ctx.type_id}"
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
