schema: v1
name: Add a pet whose type does not exist
description: >-
  Pending expectation. The contract documents 404 as "Pet or Owner not found" (openapi.yml:399-400)
  and says nothing about a pet type that does not exist. The service looks the type up by id
  (ClinicServiceImpl.java:215); with type 0 the lookup finds nothing, the insert violates a
  constraint and the handler for data-integrity errors answers 404 with a ProblemDetail
  (ExceptionControllerAdvice.java:97-108). This case records that implemented answer; it needs a
  contract statement of the status for an unknown pet type (404 or 400).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners/{ownerId}/pets|error|unknown-pet-type", variant: default}
expectation: pending
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run; a pet stored for it would be removed with it.
    If it fails, find the owner whose address starts with "apitest-<case.id_short>" in
    GET /api/owners and DELETE /api/owners/{id}.
  resources: [pets, owners]
setup:
  steps:
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: add a pet with pet type 0
    request:
      method: POST
      path: "/api/owners/${ctx.owner_id}/pets"
      body:
        name: "pet-${ctx.case.id_short}"
        birthDate: "2020-01-15"
        type:
          id: 0
          name: none
    assert:
      status: 404
      json:
        status: 404
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
  - name: the owner still has no pets
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}"
    assert:
      status: 200
      json:
        pets: []
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
