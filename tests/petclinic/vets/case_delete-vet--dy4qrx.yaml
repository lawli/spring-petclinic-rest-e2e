schema: v1
name: Delete a vet returns the deleted vet
description: >-
  Creates a vet and deletes it. The contract documents 200 with the Vet in the body
  (openapi.yml:1811-1821). The controller answers 204 without a body
  (VetRestControllerV1.java:120). Known defect, reproduced:
  defects/delete-answers-204-instead-of-200.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|DELETE|/api/vets/{vetId}|happy|delete-vet", variant: default}
known_defects:
  - ref: defects/delete-answers-204-instead-of-200.md
    step: "delete the vet"
    at: status
data:
  isolated: true
  cleanup: >-
    The case itself deletes the vet created by this run; teardown repeats the delete and expects
    404. If teardown reports a failure, find the vet whose last name is "Vet" plus the run id with
    digits mapped to letters (0-9 -> g-p) in GET /api/vets and DELETE /api/vets/{id}.
  resources: [vets]
setup:
  steps:
    - name: "setup: create a vet owned by this run"
      request:
        method: POST
        path: /api/vets
        body:
          firstName: Apitest
          lastName: &last "Vet${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}"
          specialties: []
      extract:
        vet_id: "$.id"
steps:
  - name: delete the vet
    request:
      method: DELETE
      path: "/api/vets/${ctx.vet_id}"
    assert:
      status: 200
      json:
        id: "${ctx.vet_id}"
        firstName: Apitest
        lastName: *last
teardown:
  steps:
    - name: "teardown: delete the vet if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/vets/${ctx.vet_id}"
      assert:
        status: 404
