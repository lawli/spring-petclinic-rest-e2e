schema: v1
name: Update a vet returns the updated vet
description: >-
  Creates a vet and changes its first name. The contract documents 200 with the updated Vet in the
  body (openapi.yml:1758-1768). The controller answers 204 without a body
  (VetRestControllerV1.java:108). Known defect, reproduced:
  defects/update-answers-204-instead-of-200.md. The read-only id is left out of the request body.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/vets/{vetId}|happy|update-vet", variant: default}
known_defects:
  - ref: defects/update-answers-204-instead-of-200.md
    step: "update the vet"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the vet created by this run. If it fails, find the vet whose last name is
    "Vet" plus the run id with digits mapped to letters (0-9 -> g-p) in GET /api/vets (the id is
    also in the report's residual data) and DELETE /api/vets/{id}.
  resources: [vets]
setup:
  steps:
    - name: "setup: create a vet owned by this run"
      request:
        method: POST
        path: /api/vets
        body:
          firstName: Apitest
          lastName: &last "Vet${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}"
          specialties: []
      extract:
        vet_id: "$.id"
steps:
  - name: update the vet
    request:
      method: PUT
      path: "/api/vets/${ctx.vet_id}"
      body:
        firstName: Updated
        lastName: *last
        specialties: []
    assert:
      status: 200
      json:
        id: "${ctx.vet_id}"
        firstName: Updated
        lastName: *last
        specialties: []
teardown:
  steps:
    - name: "teardown: delete the vet"
      request:
        method: DELETE
        path: "/api/vets/${ctx.vet_id}"
