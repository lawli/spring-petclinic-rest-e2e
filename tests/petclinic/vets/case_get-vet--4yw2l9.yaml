schema: v1
name: Get a vet by id returns the vet
description: >-
  Creates a vet and reads it by id. The answer is 200 with the Vet (openapi.yml:1698-1708): id,
  first name, last name and specialties, all required (openapi.yml:2258-2262).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/vets/{vetId}|happy|get-existing-vet", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the vet created by this run. If it fails, find the vet whose last name is
    "Vet" plus the run id with digits mapped to letters (0-9 -> g-p) in GET /api/vets (the id is
    also in the report's residual data) and DELETE /api/vets/{id}.
  resources: [vets]
setup:
  steps:
    - name: "setup: create a vet owned by this run"
      request:
        method: POST
        path: /api/vets
        body:
          firstName: Apitest
          lastName: &last "Vet${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}"
          specialties: []
      extract:
        vet_id: "$.id"
steps:
  - name: get the vet by id
    request:
      method: GET
      path: "/api/vets/${ctx.vet_id}"
    assert:
      status: 200
      json:
        id: "${ctx.vet_id}"
        firstName: Apitest
        lastName: *last
        specialties: []
teardown:
  steps:
    - name: "teardown: delete the vet"
      request:
        method: DELETE
        path: "/api/vets/${ctx.vet_id}"
