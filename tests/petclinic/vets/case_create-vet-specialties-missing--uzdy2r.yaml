schema: v1
name: Create a vet without the specialties field is rejected
description: >-
  specialties is required for a vet, next to both names (openapi.yml:2239-2242). A body without it
  must be answered with 400 and a ProblemDetail listing a schema validation error
  (openapi.yml:1662-1667). Nothing in the source guarantees that the request is rejected before it
  is stored: the controller accepts a vet with no specialties (VetRestControllerV1.java:81), and
  the request object is generated at build time, so a missing list may simply arrive empty. The
  case is therefore treated as a write: teardown deletes the vet carrying this run's last name if
  the service stored one.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/vets|validation|specialties-missing", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown lists the vets and deletes each one whose last name starts with "Vet" plus the run id
    with digits mapped to letters (0-9 -> g-p). If it fails, do the same by hand: GET /api/vets,
    then DELETE /api/vets/{id} for every match. If the create was rejected, nothing was stored.
  resources: [vets]
steps:
  - name: post a vet without specialties
    request:
      method: POST
      path: /api/vets
      body:
        firstName: Apitest
        lastName: "Vet${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors.0.message: "@type string"
teardown:
  python:
    - call: helpers.run_records.delete_marked
      args:
        service: petclinic
        collection: vets
        field: lastName
        prefix: "Vet{run_letters}"
