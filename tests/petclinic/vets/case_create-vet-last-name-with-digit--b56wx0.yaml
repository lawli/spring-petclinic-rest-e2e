schema: v1
name: Create a vet whose last name contains a digit is rejected
description: >-
  The vet lastName pattern admits letters, the separators space, apostrophe and hyphen, and one
  trailing period (openapi.yml:2231). A last name ending in "7" breaks it, so the answer is 400
  with a ProblemDetail (openapi.yml:1662-1667). Read-only by contract: the body is rejected before
  the handler runs. If a 2xx comes back, the response body holds the id to remove with
  DELETE /api/vets/{id}.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/vets|validation|last-name-with-digit", variant: default}
mutates: false
steps:
  - name: post a vet whose last name ends in a digit
    request:
      method: POST
      path: /api/vets
      body:
        firstName: Apitest
        lastName: "Vet${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}7"
        specialties: []
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors.0.message: "@type string"
