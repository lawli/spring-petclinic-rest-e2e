schema: v1
name: Create a vet with a 30-letter first name
description: >-
  A vet's firstName allows at most 30 characters (openapi.yml:2222). A first name of exactly 30
  letters is on the boundary and must be stored unchanged. The create step checks the returned Vet
  but not the status, because the status of a successful create is disputed separately
  (defects/create-answers-201-instead-of-200.md); the vet is then read back by id. Teardown deletes
  by the run's last-name marker, whether or not the create stored the vet.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/vets|boundary|first-name-max-length-30", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown lists the vets and deletes each one whose last name starts with "Vet" plus the run id
    with digits mapped to letters (0-9 -> g-p). If it fails, do the same by hand: GET /api/vets,
    then DELETE /api/vets/{id} for every match.
  resources: [vets]
steps:
  - name: create a vet whose first name has 30 letters
    request:
      method: POST
      path: /api/vets
      body:
        firstName: "${'A' * 30}"
        lastName: "Vet${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}"
        specialties: []
    extract:
      vet_id: "$.id"
    assert:
      json:
        id: "@number >= 0"
        firstName: "${'A' * 30}"
  - name: read the vet back
    request:
      method: GET
      path: "/api/vets/${ctx.vet_id}"
    assert:
      status: 200
      json:
        firstName: "${'A' * 30}"
teardown:
  python:
    - call: helpers.run_records.delete_marked
      args:
        service: petclinic
        collection: vets
        field: lastName
        prefix: "Vet{run_letters}"
