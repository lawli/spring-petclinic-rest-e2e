schema: v1
name: Update a vet that was deleted returns 404
description: >-
  Creates a vet, deletes it in setup and then sends a valid update for its id. The answer is 404
  with a ProblemDetail (openapi.yml:1782-1787). The controller returns 404 without a body
  (VetRestControllerV1.java:94-96). Known defect, reproduced:
  defects/not-found-without-problem-detail.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/vets/{vetId}|state|update-after-delete", variant: default}
known_defects:
  - ref: defects/not-found-without-problem-detail.md
    step: "update the deleted vet"
    at: json.status
data:
  isolated: true
  cleanup: >-
    The vet created by this run is deleted in setup; teardown repeats the delete and expects 404,
    which also catches an update that recreated the record. If teardown reports a failure, find the
    vet whose last name is "Vet" plus the run id with digits mapped to letters (0-9 -> g-p) in
    GET /api/vets and DELETE /api/vets/{id}.
  resources: [vets]
setup:
  steps:
    - name: "setup: create a vet owned by this run"
      request:
        method: POST
        path: /api/vets
        body:
          firstName: Apitest
          lastName: &last "Vet${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}"
          specialties: []
      extract:
        vet_id: "$.id"
    - name: "setup: delete the vet"
      request:
        method: DELETE
        path: "/api/vets/${ctx.vet_id}"
steps:
  - name: update the deleted vet
    request:
      method: PUT
      path: "/api/vets/${ctx.vet_id}"
      body:
        firstName: Updated
        lastName: *last
        specialties: []
    assert:
      status: 404
      json:
        status: 404
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
teardown:
  steps:
    - name: "teardown: delete the vet if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/vets/${ctx.vet_id}"
      assert:
        status: 404
