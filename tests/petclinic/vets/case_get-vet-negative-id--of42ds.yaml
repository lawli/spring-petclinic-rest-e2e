schema: v1
name: Get a vet with a negative id is a bad request
description: >-
  Read-only. vetId has minimum 0 (openapi.yml:1695) and the operation documents 400 with a
  ProblemDetail (openapi.yml:1716-1721), so -1 must be answered with 400. The exception handler
  maps only request-body validation to 400 (ExceptionControllerAdvice.java:117, 80). Known
  defect, reproduced: defects/invalid-request-values-not-answered-with-400.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/vets/{vetId}|validation|negative-id", variant: default}
known_defects:
  - ref: defects/invalid-request-values-not-answered-with-400.md
    step: "get vet -1"
    at: status
steps:
  - name: get vet -1
    request:
      method: GET
      path: /api/vets/-1
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
