schema: v1
name: Add a visit through an owner that does not exist returns 404
description: >-
  Creates an owner with a pet and posts a visit for that pet under owner 0, an id no owner can have
  (generated identities start at 1). The pet is not a pet of that owner, so the contract answers 404
  "Pet not found for this owner" with a ProblemDetail (openapi.yml:574-579), and the pet must still
  have no visits. The handler never reads the owner id (OwnerRestControllerV1.java:177-187).
  Known defect, reproduced: defects/visit-created-without-checking-owner.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners/{ownerId}/pets/{petId}/visits|error|unknown-owner", variant: default}
known_defects:
  - ref: defects/visit-created-without-checking-owner.md
    step: "add a visit for the pet under owner 0"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet (a visit stored against the contract goes with it), then the owner,
    then the pet type, all created by this run. If it fails, use the run id (case.id_short in the
    report's residual data), in this order: DELETE /api/pets/{id} for the pet named "pet-<run id>",
    DELETE /api/owners/{id} for the owner whose address starts with "apitest-<run id>",
    DELETE /api/pettypes/{id} for the type named "apitest-type-<run id>".
  resources: [visits, pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: add a visit for the pet under owner 0
    request:
      method: POST
      path: "/api/owners/0/pets/${ctx.pet_id}/visits"
      body:
        date: "2024-03-10"
        description: "apitest-${ctx.case.id_short} checkup"
    assert:
      status: 404
      json:
        status: 404
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
  - name: the pet still has no visits
    request:
      method: GET
      path: "/api/pets/${ctx.pet_id}"
    assert:
      status: 200
      json:
        visits: []
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
