schema: v1
name: Add a visit for a pet that does not exist returns 404
description: >-
  Creates an owner and posts a visit for pet 0 under it, an id no pet can have (generated
  identities start at 1). The answer is 404 "Pet not found for this owner" with a ProblemDetail
  (openapi.yml:574-579). In the implementation the insert fails on the pet foreign key and the
  handler for data-integrity errors answers 404 with a ProblemDetail
  (ExceptionControllerAdvice.java:97-108), which matches the contract.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners/{ownerId}/pets/{petId}/visits|error|unknown-pet", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run; no visit can be stored for a pet that does not
    exist. If it fails, find the owner whose address starts with "apitest-<case.id_short>" in
    GET /api/owners and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: add a visit for pet 0
    request:
      method: POST
      path: "/api/owners/${ctx.owner_id}/pets/0/visits"
      body:
        date: "2024-03-10"
        description: "apitest-${ctx.case.id_short} checkup"
    assert:
      status: 404
      json:
        status: 404
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
