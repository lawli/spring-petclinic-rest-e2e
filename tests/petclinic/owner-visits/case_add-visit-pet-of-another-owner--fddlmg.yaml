schema: v1
name: Add a visit for a pet through an owner it does not belong to returns 404
description: >-
  Creates two owners and a pet for the first one, then posts a visit for that pet under the second
  owner. The contract answers 404 "Pet not found for this owner" with a ProblemDetail
  (openapi.yml:574-579), and the pet must still have no visits. The handler never reads the owner id
  and stores the visit for the pet id alone (OwnerRestControllerV1.java:177-187). Known defect,
  reproduced: defects/visit-created-without-checking-owner.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners/{ownerId}/pets/{petId}/visits|error|pet-of-another-owner", variant: default}
known_defects:
  - ref: defects/visit-created-without-checking-owner.md
    step: "add a visit for the pet under the second owner"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the pet (a visit stored against the contract goes with it), both owners and the
    pet type, all created by this run. If it fails, use the run id (case.id_short in the report's
    residual data), in this order: DELETE /api/pets/{id} for the pet named "pet-<run id>",
    DELETE /api/owners/{id} for both owners whose address starts with "apitest-<run id>",
    DELETE /api/pettypes/{id} for the type named "apitest-type-<run id>".
  resources: [visits, pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create the owner of the pet"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: create a second owner without pets"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Other
          address: "apitest-${ctx.case.id_short} 2 Other Street"
          city: Testville
          telephone: "6085550101"
      extract:
        other_owner_id: "$.id"
    - name: "setup: add a pet to the first owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: add a visit for the pet under the second owner
    request:
      method: POST
      path: "/api/owners/${ctx.other_owner_id}/pets/${ctx.pet_id}/visits"
      body:
        date: "2024-03-10"
        description: "apitest-${ctx.case.id_short} checkup"
    assert:
      status: 404
      json:
        status: 404
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
  - name: the pet still has no visits
    request:
      method: GET
      path: "/api/pets/${ctx.pet_id}"
    assert:
      status: 200
      json:
        visits: []
teardown:
  steps:
    - name: "teardown: delete the pet"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
    - name: "teardown: delete the first owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
    - name: "teardown: delete the second owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.other_owner_id}"
    - name: "teardown: delete the pet type"
      request:
        method: DELETE
        path: "/api/pettypes/${ctx.type_id}"
