schema: v1
name: Create an owner with a 21-digit telephone is rejected
description: >-
  telephone allows at most 20 characters (openapi.yml:2031). 21 digits is one past the boundary, so
  the answer is 400 with a ProblemDetail. Read-only by contract: the body is rejected before the
  handler runs. If a 2xx comes back, the response body holds the id to remove with
  DELETE /api/owners/{id}.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners|validation|telephone-over-max-length", variant: default}
mutates: false
steps:
  - name: post an owner with a 21-digit telephone
    request:
      method: POST
      path: /api/owners
      body:
        firstName: Apitest
        lastName: Owner
        address: "apitest-${ctx.case.id_short} 1 Test Street"
        city: Testville
        telephone: "123456789012345678901"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors.0.message: "@type string"
