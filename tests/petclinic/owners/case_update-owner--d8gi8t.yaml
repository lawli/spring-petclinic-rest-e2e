schema: v1
name: Update an owner returns the updated owner
description: >-
  Creates an owner and replaces its editable fields. The contract documents 200 with the updated
  Owner in the body (openapi.yml:284-289). The controller answers 204 without a body
  (OwnerRestControllerV1.java:124). Known defect, reproduced:
  defects/update-answers-204-instead-of-200.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/owners/{ownerId}|happy|update-owner", variant: default}
known_defects:
  - ref: defects/update-answers-204-instead-of-200.md
    step: "update the owner"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: update the owner
    request:
      method: PUT
      path: "/api/owners/${ctx.owner_id}"
      body:
        firstName: Updated
        lastName: Owner
        address: "apitest-${ctx.case.id_short} 2 Changed Avenue"
        city: Newtown
        telephone: "6085550199"
    assert:
      status: 200
      json:
        id: "${ctx.owner_id}"
        firstName: Updated
        lastName: Owner
        address: "apitest-${ctx.case.id_short} 2 Changed Avenue"
        city: Newtown
        telephone: "6085550199"
        pets: "@type array"
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
