schema: v1
name: Create an owner whose last name has a separator and a trailing period
description: >-
  The lastName pattern (openapi.yml:2010) allows up to two extra words joined by a space, an
  apostrophe or a hyphen, and one trailing period. "Owner Jr." uses both and must be accepted with
  201 and stored unchanged.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners|boundary|last-name-separator-and-trailing-period", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
steps:
  - name: create an owner named "Owner Jr."
    request:
      method: POST
      path: /api/owners
      body:
        firstName: Apitest
        lastName: Owner Jr.
        address: "apitest-${ctx.case.id_short} 1 Test Street"
        city: Testville
        telephone: "6085550100"
    extract:
      owner_id: "$.id"
    assert:
      status: 201
      json:
        lastName: Owner Jr.
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
