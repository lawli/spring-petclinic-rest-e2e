schema: v1
name: Get an owner after it was deleted returns 404
description: >-
  Creates an owner, deletes it in setup and then reads it by id: a deleted owner is no longer found
  (404, openapi.yml:248). Only the status is checked here; the 404 body is covered by the id-zero
  case. The setup delete carries no status assertion because its documented status is disputed
  (defects/delete-answers-204-instead-of-200.md).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/owners/{ownerId}|state|get-after-delete", variant: default}
data:
  isolated: true
  cleanup: >-
    The owner created by this run is deleted in setup; teardown repeats the delete and expects 404.
    If teardown reports a failure, find the owner whose address starts with
    "apitest-<case.id_short>" in GET /api/owners and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
steps:
  - name: get the deleted owner
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}"
    assert:
      status: 404
teardown:
  steps:
    - name: "teardown: delete the owner if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
      assert:
        status: 404
