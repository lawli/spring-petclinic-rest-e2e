schema: v1
name: Create an owner with a 31-letter first name is rejected
description: >-
  firstName allows at most 30 characters (openapi.yml:2001). 31 letters is one past the boundary,
  so the answer is 400 with a ProblemDetail. Read-only by contract: the body is rejected before
  the handler runs. If a 2xx comes back, the response body holds the id to remove with
  DELETE /api/owners/{id}.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners|validation|first-name-over-max-length", variant: default}
mutates: false
steps:
  - name: post an owner whose first name has 31 letters
    request:
      method: POST
      path: /api/owners
      body:
        firstName: "${'A' * 31}"
        lastName: Owner
        address: "apitest-${ctx.case.id_short} 1 Test Street"
        city: Testville
        telephone: "6085550100"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors.0.message: "@type string"
