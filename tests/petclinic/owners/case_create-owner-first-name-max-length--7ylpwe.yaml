schema: v1
name: Create an owner with a 30-letter first name
description: >-
  firstName allows at most 30 characters (openapi.yml:2001). A first name of exactly 30 letters is
  on the boundary and must be accepted with 201 and stored unchanged.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners|boundary|first-name-max-length-30", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
steps:
  - name: create an owner whose first name has 30 letters
    request:
      method: POST
      path: /api/owners
      body:
        firstName: "${'A' * 30}"
        lastName: Owner
        address: "apitest-${ctx.case.id_short} 1 Test Street"
        city: Testville
        telephone: "6085550100"
    extract:
      owner_id: "$.id"
    assert:
      status: 201
      json:
        firstName: "${'A' * 30}"
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
