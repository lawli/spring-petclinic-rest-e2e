schema: v1
name: Update an owner to a 20-digit telephone number
description: >-
  The contract allows a telephone of 1 to 20 digits (openapi.yml:2030-2032), so an update to a
  20-digit number must be stored. The check reads the owner back instead of asserting the update
  response, whose status is disputed separately. The Owner entity requires exactly 10 digits
  (Owner.java:49). Known defect, reproduced:
  defects/owner-telephone-stricter-than-contract.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/owners/{ownerId}|boundary|telephone-max-length-20", variant: default}
known_defects:
  - ref: defects/owner-telephone-stricter-than-contract.md
    step: "the owner now has the 20-digit telephone"
    at: json.telephone
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: update the owner to a 20-digit telephone
    request:
      method: PUT
      path: "/api/owners/${ctx.owner_id}"
      body:
        firstName: Apitest
        lastName: Owner
        address: "apitest-${ctx.case.id_short} 1 Test Street"
        city: Testville
        telephone: "12345678901234567890"
  - name: the owner now has the 20-digit telephone
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}"
    assert:
      status: 200
      json:
        telephone: "12345678901234567890"
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
