schema: v1
name: Update with a negative owner id is a bad request and touches no owner
description: >-
  ownerId has minimum 0 (openapi.yml:274) and the operation documents 400 (openapi.yml:290-295).
  The request uses the negated id of an owner created for this run, so the case can also show that
  the invalid id does not reach that owner's record. The exception handler maps only request-body
  validation to 400 (ExceptionControllerAdvice.java:117, 80). Known defect, reproduced:
  defects/invalid-request-values-not-answered-with-400.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/owners/{ownerId}|validation|negative-id", variant: default}
known_defects:
  - ref: defects/invalid-request-values-not-answered-with-400.md
    step: "update using the negated owner id"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: update using the negated owner id
    request:
      method: PUT
      path: "/api/owners/-${ctx.owner_id}"
      body:
        firstName: Updated
        lastName: Owner
        address: "apitest-${ctx.case.id_short} 1 Test Street"
        city: Newtown
        telephone: "6085550199"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
  - name: the owner with the positive id is unchanged
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}"
    assert:
      status: 200
      json:
        firstName: Apitest
        city: Testville
        telephone: "6085550100"
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
