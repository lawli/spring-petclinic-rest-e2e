schema: v1
name: Update an owner with an empty first name is rejected and changes nothing
description: >-
  firstName needs at least one character (openapi.yml:2000). An update with an empty first name
  must be answered with 400 and a ProblemDetail (openapi.yml:290-295), and the stored owner must
  keep its original values.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|PUT|/api/owners/{ownerId}|validation|first-name-empty", variant: default}
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: update the owner with an empty first name
    request:
      method: PUT
      path: "/api/owners/${ctx.owner_id}"
      body:
        firstName: ""
        lastName: Changed
        address: "apitest-${ctx.case.id_short} 1 Test Street"
        city: Newtown
        telephone: "6085550199"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors.0.message: "@type string"
  - name: the owner still has its original values
    request:
      method: GET
      path: "/api/owners/${ctx.owner_id}"
    assert:
      status: 200
      json:
        firstName: Apitest
        lastName: Owner
        city: Testville
        telephone: "6085550100"
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
