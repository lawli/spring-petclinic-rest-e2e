schema: v1
name: Get an owner with a non-numeric id is a bad request
description: >-
  Read-only. ownerId is declared as an integer (openapi.yml:219) and the operation documents 400
  with a ProblemDetail (openapi.yml:242-247), so "abc" must be answered with 400. A type mismatch is
  not request-body validation, so the handler chain ends in the catch-all that answers 500
  (ExceptionControllerAdvice.java:80). Known defect, reproduced:
  defects/invalid-request-values-not-answered-with-400.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/owners/{ownerId}|validation|non-numeric-id", variant: default}
known_defects:
  - ref: defects/invalid-request-values-not-answered-with-400.md
    step: "get owner \"abc\""
    at: status
steps:
  - name: get owner "abc"
    request:
      method: GET
      path: /api/owners/abc
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
