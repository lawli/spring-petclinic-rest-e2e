schema: v1
name: Create an owner with a 20-digit telephone number
description: >-
  The contract allows a telephone of 1 to 20 digits (openapi.yml:2030-2032). A 20-digit number is on
  the boundary and must be accepted with 201. The Owner entity requires exactly 10 digits
  (Owner.java:49), and the service answers 500 instead. Known defect, reproduced:
  defects/owner-telephone-stricter-than-contract.md. Because the create may or may not store an
  owner, teardown does not rely on an id from the response: a helper deletes every owner that
  carries this run's address marker.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/owners|boundary|telephone-max-length-20", variant: default}
known_defects:
  - ref: defects/owner-telephone-stricter-than-contract.md
    step: create an owner with a 20-digit telephone
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown lists the owners and deletes each one whose address starts with
    "apitest-<case.id_short> ". If it fails, do the same by hand: GET /api/owners, then
    DELETE /api/owners/{id} for every match. If the create was rejected, nothing was stored.
  resources: [owners]
steps:
  - name: create an owner with a 20-digit telephone
    request:
      method: POST
      path: /api/owners
      body:
        firstName: Apitest
        lastName: Owner
        address: "apitest-${ctx.case.id_short} 1 Test Street"
        city: Testville
        telephone: "12345678901234567890"
    assert:
      status: 201
      json:
        telephone: "12345678901234567890"
teardown:
  python:
    - call: helpers.cleanup.delete_owners_of_run
      args:
        service: petclinic
