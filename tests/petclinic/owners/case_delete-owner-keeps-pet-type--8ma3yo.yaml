schema: v1
name: Deleting an owner leaves the pet type of its pets in place
description: >-
  Pending expectation. The contract scopes the operation to the owner ("Delete an owner by ID",
  openapi.yml:313) and treats pet types as a resource of their own, but it does not say what
  happens to the type of a deleted owner's pets. Pet.type is mapped with cascade ALL
  (Pet.java:37), which propagates the removal from the pet to its type. This case records the
  expectation that the type survives. Observed on the first run: the pet type is gone after the
  owner delete (GET /api/pettypes/{id} answers 404), so this case fails until the intended
  behavior is confirmed. The pet type is created for this run, so shared reference data is never
  at risk. Teardown removes the type through a helper that deletes it only if it is still there.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|DELETE|/api/owners/{ownerId}|state|delete-owner-keeps-pet-type", variant: default}
expectation: pending
data:
  isolated: true
  cleanup: >-
    The case deletes the owner, which removes its pet; teardown repeats both deletes expecting 404,
    then lists the pet types and deletes the one named "apitest-type-<case.id_short>" if the owner
    delete left it. If teardown reports a failure, use the run id (case.id_short in the report's
    residual data), in this order: DELETE /api/pets/{id} for the pet named "pet-<run id>",
    DELETE /api/owners/{id} for the owner whose address starts with "apitest-<run id>",
    DELETE /api/pettypes/{id} for the type named "apitest-type-<run id>".
  resources: [pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
steps:
  - name: delete the owner
    request:
      method: DELETE
      path: "/api/owners/${ctx.owner_id}"
  - name: the pet type still exists
    request:
      method: GET
      path: "/api/pettypes/${ctx.type_id}"
    assert:
      status: 200
      json:
        id: "${ctx.type_id}"
        name: "apitest-type-${ctx.case.id_short}"
teardown:
  steps:
    - name: "teardown: delete the pet if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
      assert:
        status: 404
    - name: "teardown: delete the owner if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
      assert:
        status: 404
  python:
    - call: helpers.cleanup.delete_pet_type_of_run
      args:
        service: petclinic
