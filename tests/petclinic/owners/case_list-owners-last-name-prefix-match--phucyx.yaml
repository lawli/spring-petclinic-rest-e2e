schema: v1
name: List owners matches a last-name prefix
description: >-
  Pending expectation. The contract only says the lastName parameter is a "Last name"
  (openapi.yml:105-107); the repository query matches by prefix (SpringDataOwnerRepository.java:40,
  LIKE :lastName%). This case records the implemented prefix behavior: filtering by the first eight
  letters of a run-unique last name returns that owner. It needs a statement of whether the filter
  is meant to be exact or a prefix match.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/owners|boundary|last-name-prefix-match", variant: default}
expectation: pending
data:
  isolated: true
  cleanup: >-
    Teardown deletes the owner created by this run. If it fails, find the owner whose address starts
    with "apitest-<case.id_short>" in GET /api/owners (the id is also in the report's residual data)
    and DELETE /api/owners/{id}.
  resources: [owners]
setup:
  steps:
    - name: "setup: create an owner with a run-unique last name"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: &last "Zz${ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p')}"
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
steps:
  - name: list owners with the first eight letters of the last name
    request:
      method: GET
      path: /api/owners
      params:
        lastName: "Zz${(ctx.case.id_short|replace('0','g')|replace('1','h')|replace('2','i')|replace('3','j')|replace('4','k')|replace('5','l')|replace('6','m')|replace('7','n')|replace('8','o')|replace('9','p'))[:6]}"
    assert:
      status: 200
      json:
        "$": "@len 1"
        0.id: "${ctx.owner_id}"
        0.lastName: *last
teardown:
  steps:
    - name: "teardown: delete the owner"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
