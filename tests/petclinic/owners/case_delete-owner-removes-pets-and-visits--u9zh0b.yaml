schema: v1
name: Deleting an owner removes its pets and their visits
description: >-
  Creates an owner with a pet and a visit, deletes the owner and checks that the pet and the visit
  are gone. Pets and visits are declared to follow their parent: the foreign keys cascade on delete
  (schema.sql:48, 59) and Owner.pets cascades all operations (Owner.java:52). The delete step
  asserts nothing because its documented status is disputed separately. The pet uses a pet type
  created for this run, so no shared reference data is involved. The first run showed that the
  owner delete also removes that pet type (see the pending case delete-owner-keeps-pet-type), so
  teardown removes the type through a helper that deletes it only if it is still there.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|DELETE|/api/owners/{ownerId}|state|delete-owner-removes-pets-and-visits", variant: default}
data:
  isolated: true
  cleanup: >-
    The case deletes the owner, which removes its pet and visit; teardown repeats both deletes
    expecting 404, then lists the pet types and deletes the one named
    "apitest-type-<case.id_short>" if the owner delete left it. If teardown reports a failure, use
    the run id (case.id_short in the report's residual data), in this order: DELETE /api/pets/{id}
    for the pet named "pet-<run id>", DELETE /api/owners/{id} for the owner whose address starts
    with "apitest-<run id>", DELETE /api/pettypes/{id} for the type named "apitest-type-<run id>".
  resources: [visits, pets, owners, pettypes]
setup:
  steps:
    - name: "setup: create a pet type owned by this run"
      request:
        method: POST
        path: /api/pettypes
        body:
          name: "apitest-type-${ctx.case.id_short}"
      extract:
        type_id: "$.id"
    - name: "setup: create an owner owned by this run"
      request:
        method: POST
        path: /api/owners
        body:
          firstName: Apitest
          lastName: Owner
          address: "apitest-${ctx.case.id_short} 1 Test Street"
          city: Testville
          telephone: "6085550100"
      extract:
        owner_id: "$.id"
    - name: "setup: add a pet to the owner"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets"
        body:
          name: "pet-${ctx.case.id_short}"
          birthDate: "2020-01-15"
          type:
            id: "${ctx.type_id}"
            name: "apitest-type-${ctx.case.id_short}"
      extract:
        pet_id: "$.id"
    - name: "setup: add a visit to the pet"
      request:
        method: POST
        path: "/api/owners/${ctx.owner_id}/pets/${ctx.pet_id}/visits"
        body:
          date: "2024-03-10"
          description: "apitest-${ctx.case.id_short} checkup"
      extract:
        visit_id: "$.id"
steps:
  - name: delete the owner
    request:
      method: DELETE
      path: "/api/owners/${ctx.owner_id}"
  - name: the pet is gone
    request:
      method: GET
      path: "/api/pets/${ctx.pet_id}"
    assert:
      status: 404
  - name: the visit is gone
    request:
      method: GET
      path: "/api/visits/${ctx.visit_id}"
    assert:
      status: 404
teardown:
  steps:
    - name: "teardown: delete the pet if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/pets/${ctx.pet_id}"
      assert:
        status: 404
    - name: "teardown: delete the owner if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/owners/${ctx.owner_id}"
      assert:
        status: 404
  python:
    - call: helpers.cleanup.delete_pet_type_of_run
      args:
        service: petclinic
