schema: v1
name: Get a specialty after it was deleted returns 404
description: >-
  Creates a specialty, deletes it in setup and reads it by id: a deleted specialty is no longer
  found (404, openapi.yml:1470). Only the status is checked here; the 404 body is covered by the
  id-zero case. The setup delete carries no status assertion because its documented status is
  disputed (defects/delete-answers-204-instead-of-200.md).
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|GET|/api/specialties/{specialtyId}|state|get-after-delete", variant: default}
data:
  isolated: true
  cleanup: >-
    The specialty created by this run is deleted in setup; teardown repeats the delete and expects
    404. If teardown reports a failure, find the specialty named
    "apitest-specialty-<case.id_short>" in GET /api/specialties and DELETE /api/specialties/{id}.
  resources: [specialties]
setup:
  steps:
    - name: "setup: create a specialty owned by this run"
      request:
        method: POST
        path: /api/specialties
        body:
          name: "apitest-specialty-${ctx.case.id_short}"
      extract:
        specialty_id: "$.id"
    - name: "setup: delete the specialty"
      request:
        method: DELETE
        path: "/api/specialties/${ctx.specialty_id}"
steps:
  - name: get the deleted specialty
    request:
      method: GET
      path: "/api/specialties/${ctx.specialty_id}"
    assert:
      status: 404
teardown:
  steps:
    - name: "teardown: delete the specialty if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/specialties/${ctx.specialty_id}"
      assert:
        status: 404
