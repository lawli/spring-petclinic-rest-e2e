schema: v1
name: Delete a specialty returns the deleted specialty
description: >-
  Creates a specialty that no vet has and deletes it. The contract documents 200 with the
  Specialty in the body (openapi.yml:1559-1569). The controller answers 204 without a body
  (SpecialtyRestControllerV1.java:105). Known defect, reproduced:
  defects/delete-answers-204-instead-of-200.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|DELETE|/api/specialties/{specialtyId}|happy|delete-specialty", variant: default}
known_defects:
  - ref: defects/delete-answers-204-instead-of-200.md
    step: "delete the specialty"
    at: status
data:
  isolated: true
  cleanup: >-
    The case itself deletes the specialty created by this run; teardown repeats the delete and
    expects 404. If teardown reports a failure, find the specialty named
    "apitest-specialty-<case.id_short>" in GET /api/specialties and DELETE /api/specialties/{id}.
  resources: [specialties]
setup:
  steps:
    - name: "setup: create a specialty owned by this run"
      request:
        method: POST
        path: /api/specialties
        body:
          name: "apitest-specialty-${ctx.case.id_short}"
      extract:
        specialty_id: "$.id"
steps:
  - name: delete the specialty
    request:
      method: DELETE
      path: "/api/specialties/${ctx.specialty_id}"
    assert:
      status: 200
      json:
        id: "${ctx.specialty_id}"
        name: "apitest-specialty-${ctx.case.id_short}"
teardown:
  steps:
    - name: "teardown: delete the specialty if it is still there (404 once deleted)"
      request:
        method: DELETE
        path: "/api/specialties/${ctx.specialty_id}"
      assert:
        status: 404
