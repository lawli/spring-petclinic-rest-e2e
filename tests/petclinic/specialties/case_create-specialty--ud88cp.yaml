schema: v1
name: Create a specialty returns the stored specialty
description: >-
  Posts a Specialty body with a name; the read-only id is left out. The contract documents 200 with
  the stored Specialty (openapi.yml:1392-1402): generated id and the submitted name. The controller
  answers 201 (SpecialtyRestControllerV1.java:81). Known defect, reproduced:
  defects/create-answers-201-instead-of-200.md. Teardown does not rely on an id from the response:
  a helper deletes the specialty that carries this run's name, whether or not the create stored it.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|POST|/api/specialties|happy|create-specialty", variant: default}
known_defects:
  - ref: defects/create-answers-201-instead-of-200.md
    step: "create the specialty"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown lists the specialties and deletes each one whose name starts with
    "apitest-specialty-<case.id_short>". If it fails, do the same by hand: GET /api/specialties,
    then DELETE /api/specialties/{id} for every match.
  resources: [specialties]
steps:
  - name: create the specialty
    request:
      method: POST
      path: /api/specialties
      body:
        name: "apitest-specialty-${ctx.case.id_short}"
    assert:
      status: 200
      json:
        id: "@number >= 0"
        name: "apitest-specialty-${ctx.case.id_short}"
teardown:
  python:
    - call: helpers.run_records.delete_marked
      args:
        service: petclinic
        collection: specialties
        field: name
        prefix: "apitest-specialty-{run}"
