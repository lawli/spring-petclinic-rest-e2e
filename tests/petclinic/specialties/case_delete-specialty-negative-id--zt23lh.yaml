schema: v1
name: Delete with a negative specialty id is a bad request and deletes no specialty
description: >-
  specialtyId has minimum 0 (openapi.yml:1556) and the operation documents 400
  (openapi.yml:1577-1582). The request uses the negated id of a specialty created for this run, so
  the case can also show that the invalid id does not delete that specialty. The exception handler
  maps only request-body validation to 400 (ExceptionControllerAdvice.java:117, 80). Known
  defect, reproduced: defects/invalid-request-values-not-answered-with-400.md.
service: petclinic
source_commit: 4cd8e1b0cd42578e882247d8801f6be5d402f118
covers:
  - {key: "petclinic|DELETE|/api/specialties/{specialtyId}|validation|negative-id", variant: default}
known_defects:
  - ref: defects/invalid-request-values-not-answered-with-400.md
    step: "delete using the negated specialty id"
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the specialty created by this run. If it fails, find the specialty named
    "apitest-specialty-<case.id_short>" in GET /api/specialties (the id is also in the report's
    residual data) and DELETE /api/specialties/{id}.
  resources: [specialties]
setup:
  steps:
    - name: "setup: create a specialty owned by this run"
      request:
        method: POST
        path: /api/specialties
        body:
          name: "apitest-specialty-${ctx.case.id_short}"
      extract:
        specialty_id: "$.id"
steps:
  - name: delete using the negated specialty id
    request:
      method: DELETE
      path: "/api/specialties/-${ctx.specialty_id}"
    assert:
      status: 400
      json:
        status: 400
        title: "@type string"
        detail: "@type string"
        type: "@type string"
        timestamp: "@iso8601"
        schemaValidationErrors: "@type array"
  - name: the specialty with the positive id still exists
    request:
      method: GET
      path: "/api/specialties/${ctx.specialty_id}"
    assert:
      status: 200
      json:
        id: "${ctx.specialty_id}"
teardown:
  steps:
    - name: "teardown: delete the specialty"
      request:
        method: DELETE
        path: "/api/specialties/${ctx.specialty_id}"
